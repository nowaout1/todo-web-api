[package]
name = "todo-web-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
dotenvy = "0.15.7"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
prost = "0.14.1"
prost-types = "0.14.1"
tonic = "0.14.1"
tonic-prost = "0.14.1"
thiserror = "2.0.16"
serde_json = "1.0.143"
serde = { version = "1.0.219", features = ["serde_derive"] }
chrono = "0.4.41"
tower-http = { version = "0.6.6", features = ["cors", "trace", "limit"] }

[build-dependencies]
tonic-prost-build = "0.14.1"

[profile.release]
opt-level = 3
overflow-checks = false
lto = "thin"
debug-assertions = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false

[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false       # when possible

[profile.release.build-override]
opt-level = 0
codegen-units = 256
